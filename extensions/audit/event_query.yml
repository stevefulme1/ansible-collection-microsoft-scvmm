---
# extensions/audit/event_query.yml
# Indirect Node Counting query for stevefulme1.svcmm
stevefulme1.svcmm.scvmm_vm:
  query: >-
    {
      name: .vm.Name,
      canonical_facts: {
        uuid: .vm.ID
      },
      facts: {
        device_type: "virtual_machine"
      }
    }

stevefulme1.svcmm.scvmm_host:
  query: >-
    {
      name: .host.ComputerName,
      canonical_facts: {
        uuid: .host.ID
      },
      facts: {
        device_type: "hypervisor"
      }
    }
