---
# Required
# cloud_name: ""

# SCVMM connection
scvmm_host: "{{ lookup('env', 'SCVMM_HOST') }}"
scvmm_port: 8100

# Cloud configuration
cloud_description: "Managed by Ansible"
cloud_state: present

# Host groups
cloud_host_groups: []
#   - "All Hosts\\Production"

# Capacity
cloud_capacity_enabled: true
cloud_capacity_cpu_count: 100
cloud_capacity_memory_mb: 524288
cloud_capacity_storage_gb: 10240
cloud_capacity_vm_count: 500

# Logical networks
cloud_logical_networks: []
#   - "Management"
#   - "Production"

# Library
cloud_library_shares: []
#   - "\\\\libserver\\VMLibrary"

# User roles
cloud_user_roles: []
#   - name: "TenantAdmin"
#     members:
#       - "DOMAIN\\CloudAdmins"
#     permissions:
#       - "Deploy"
#       - "Manage"
