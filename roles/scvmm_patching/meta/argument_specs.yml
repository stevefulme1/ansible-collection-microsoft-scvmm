---
argument_specs:
  main:
    short_description: "Rolling patch management for Hyper-V hosts"
    options:
      scvmm_patching_host:
        description: Target host address
        type: str
        required: true
      scvmm_patching_username:
        description: Authentication username
        type: str
      scvmm_patching_password:
        description: Authentication password
        type: str
      scvmm_patching_api_key:
        description: API key for authentication
        type: str
      scvmm_patching_validate_certs:
        description: Validate SSL certificates
        type: bool
        default: true
      scvmm_patching_state:
        description: Desired state
        type: str
        default: present
        choices: [present, absent]
