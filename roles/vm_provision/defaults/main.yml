---
# Required
# vm_provision_vm_name: ""
# vm_provision_template_name: ""
# scvmm_cloud: ""

# SCVMM connection
vm_provision_scvmm_host: "{{ lookup('env', 'SCVMM_HOST') }}"
vm_provision_scvmm_port: 8100

# VM settings
vm_provision_cpu_count: 2
vm_provision_memory_mb: 4096
vm_provision_dynamic_memory: true
vm_provision_dynamic_memory_min_mb: 2048
vm_provision_dynamic_memory_max_mb: 8192
vm_provision_description: "Provisioned by Ansible"

# Network
vm_provision_vm_network: ""
vm_provision_network_adapter_mac_type: "Dynamic"
vm_provision_ip_allocation: "DHCP"
vm_provision_static_ip: ""
vm_provision_subnet: ""
vm_provision_gateway: ""

# Storage
vm_provision_additional_disks: []
#   - size_gb: 50
#     bus_type: "SCSI"
#     bus: 0
#     lun: 1

# State
vm_provision_vm_state: present
vm_provision_start_vm: true
vm_provision_wait_for_ip: true
vm_provision_wait_timeout: 600

# Hardware profile
vm_provision_hardware_profile: ""

# Custom properties
vm_provision_custom_properties: {}
