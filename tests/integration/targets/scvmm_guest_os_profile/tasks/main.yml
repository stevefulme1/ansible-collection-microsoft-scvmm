---
# Integration tests for stevefulme1.svcmm.scvmm_guest_os_profile

- name: Create scvmm_guest_os_profile
  stevefulme1.svcmm.scvmm_guest_os_profile:
    name: "ansible-test-osp"
    os_type: "Windows Server 2022"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_guest_os_profile again (idempotency)
  stevefulme1.svcmm.scvmm_guest_os_profile:
    name: "ansible-test-osp"
    os_type: "Windows Server 2022"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete scvmm_guest_os_profile
  stevefulme1.svcmm.scvmm_guest_os_profile:
    name: "ansible-test-osp"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_guest_os_profile again (idempotency)
  stevefulme1.svcmm.scvmm_guest_os_profile:
    name: "ansible-test-osp"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
