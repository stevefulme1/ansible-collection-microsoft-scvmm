---
# Integration tests for stevefulme1.svcmm.scvmm_ip_pool

- name: Create scvmm_ip_pool
  stevefulme1.svcmm.scvmm_ip_pool:
    name: "ansible-test-ippool"
    logical_network_definition: "{{ scvmm_test_lnd }}"
    subnet: "10.99.0.0/24"
    start_address: "10.99.0.100"
    end_address: "10.99.0.200"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_ip_pool again (idempotency)
  stevefulme1.svcmm.scvmm_ip_pool:
    name: "ansible-test-ippool"
    logical_network_definition: "{{ scvmm_test_lnd }}"
    subnet: "10.99.0.0/24"
    start_address: "10.99.0.100"
    end_address: "10.99.0.200"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete scvmm_ip_pool
  stevefulme1.svcmm.scvmm_ip_pool:
    name: "ansible-test-ippool"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_ip_pool again (idempotency)
  stevefulme1.svcmm.scvmm_ip_pool:
    name: "ansible-test-ippool"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
