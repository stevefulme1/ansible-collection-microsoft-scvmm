---
# Integration tests for stevefulme1.svcmm.scvmm_logical_network_definition

- name: Create scvmm_logical_network_definition
  stevefulme1.svcmm.scvmm_logical_network_definition:
    name: "ansible-test-lnd"
    logical_network: "{{ scvmm_test_logical_network }}"
    host_group: "All Hosts"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_logical_network_definition again (idempotency)
  stevefulme1.svcmm.scvmm_logical_network_definition:
    name: "ansible-test-lnd"
    logical_network: "{{ scvmm_test_logical_network }}"
    host_group: "All Hosts"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete scvmm_logical_network_definition
  stevefulme1.svcmm.scvmm_logical_network_definition:
    name: "ansible-test-lnd"
    logical_network: "{{ scvmm_test_logical_network }}"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_logical_network_definition again (idempotency)
  stevefulme1.svcmm.scvmm_logical_network_definition:
    name: "ansible-test-lnd"
    logical_network: "{{ scvmm_test_logical_network }}"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
