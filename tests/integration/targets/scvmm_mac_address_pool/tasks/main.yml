---
# Integration tests for stevefulme1.svcmm.scvmm_mac_address_pool

- name: Create scvmm_mac_address_pool
  stevefulme1.svcmm.scvmm_mac_address_pool:
    name: "ansible-test-mac"
    start_address: "00:1A:2B:00:00:00"
    end_address: "00:1A:2B:FF:FF:FF"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_mac_address_pool again (idempotency)
  stevefulme1.svcmm.scvmm_mac_address_pool:
    name: "ansible-test-mac"
    start_address: "00:1A:2B:00:00:00"
    end_address: "00:1A:2B:FF:FF:FF"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete scvmm_mac_address_pool
  stevefulme1.svcmm.scvmm_mac_address_pool:
    name: "ansible-test-mac"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_mac_address_pool again (idempotency)
  stevefulme1.svcmm.scvmm_mac_address_pool:
    name: "ansible-test-mac"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
