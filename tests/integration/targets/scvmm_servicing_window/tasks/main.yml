---
# Integration tests for stevefulme1.svcmm.scvmm_servicing_window

- name: Create scvmm_servicing_window
  stevefulme1.svcmm.scvmm_servicing_window:
    name: "ansible-test-svcwin"
    category: "All"
    start_date: "2026-06-01"
    end_date: "2026-06-30"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_servicing_window again (idempotency)
  stevefulme1.svcmm.scvmm_servicing_window:
    name: "ansible-test-svcwin"
    category: "All"
    start_date: "2026-06-01"
    end_date: "2026-06-30"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update scvmm_servicing_window
  stevefulme1.svcmm.scvmm_servicing_window:
    name: "ansible-test-svcwin"
    category: "All"
    start_date: "2026-07-01"
    end_date: "2026-07-31"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete scvmm_servicing_window
  stevefulme1.svcmm.scvmm_servicing_window:
    name: "ansible-test-svcwin"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_servicing_window again (idempotency)
  stevefulme1.svcmm.scvmm_servicing_window:
    name: "ansible-test-svcwin"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
