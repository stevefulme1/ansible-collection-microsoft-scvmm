---
# Integration tests for stevefulme1.svcmm.scvmm_vm_network

- name: Create scvmm_vm_network
  stevefulme1.svcmm.scvmm_vm_network:
    name: "ansible-test-vmnet"
    logical_network: "{{ scvmm_test_logical_network }}"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create scvmm_vm_network again (idempotency)
  stevefulme1.svcmm.scvmm_vm_network:
    name: "ansible-test-vmnet"
    logical_network: "{{ scvmm_test_logical_network }}"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update scvmm_vm_network
  stevefulme1.svcmm.scvmm_vm_network:
    name: "ansible-test-vmnet"
    logical_network: "{{ scvmm_test_logical_network }}"
    description: "Updated"
    state: present
    scvmm_server: "{{ scvmm_test_server }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete scvmm_vm_network
  stevefulme1.svcmm.scvmm_vm_network:
    name: "ansible-test-vmnet"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete scvmm_vm_network again (idempotency)
  stevefulme1.svcmm.scvmm_vm_network:
    name: "ansible-test-vmnet"
    state: absent
    scvmm_server: "{{ scvmm_test_server }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
